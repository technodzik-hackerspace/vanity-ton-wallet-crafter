[package]
name = "vanity-ton-wallet-crafter"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
readme = "README.md"
keywords = ["ton", "vanity-address", "wallet", "ledger", "telegram"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
description = "Offline vanity-address generator for TON wallets: Telegram, V4R2, V5R1 and Ledger"

[dependencies]
# Telegram's own wallet engine (the submodule telegram-android ships), pinned to the
# revision Telegram Android 13.0.2 builds. Telegram candidates are derived by its import path.
wallet-engine = { git = "https://github.com/dkaraush/wallet-engine.git", rev = "5c65e47cb8d68727c20d89382d0bc51292486b9a" }
# The TON SDK that same revision vendors: V4R2 / V5R1 contract code and the TON mnemonic scheme.
ton = { git = "https://github.com/dkaraush/wallet-engine.git", rev = "5c65e47cb8d68727c20d89382d0bc51292486b9a", default-features = false }
async-trait = "=0.1.89"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
toml = "0.9"
zeroize = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
